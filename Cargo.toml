[workspace]
members = [
  "crates/treehouse-app",
  "crates/treehouse-core",
  "crates/treehouse-parser",
  "crates/treehouse-tree",
  "crates/treehouse-search",
  "crates/treehouse-stats",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Treehouse Contributors"]

[workspace.dependencies]
anyhow = "1"
eframe = { version = "0.29" }
egui = "0.29"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
