[workspace]
members = [
  "crates/treehouse-agent",
  "crates/treehouse-application-model",
  "crates/treehouse-api",
  "crates/treehouse-api-engine",
  "crates/treehouse-app",
  "crates/treehouse-contracts",
  "crates/treehouse-convex",
  "crates/treehouse-core",
  "crates/treehouse-diff",
  "crates/treehouse-drift",
  "crates/treehouse-experience",
  "crates/treehouse-execution",
  "crates/treehouse-graph",
  "crates/treehouse-identity",
  "crates/treehouse-migration",
  "crates/treehouse-mock",
  "crates/treehouse-model-inference",
  "crates/treehouse-parser",
  "crates/treehouse-postgres",
  "crates/treehouse-process",
  "crates/treehouse-query",
  "crates/treehouse-search",
  "crates/treehouse-stats",
  "crates/treehouse-subsystem-engine",
  "crates/treehouse-system-graph",
  "crates/treehouse-tree",
  "crates/treehouse-twin",
  "crates/treehouse-observer",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Treehouse Contributors"]

[workspace.dependencies]
anyhow = "1"
dirs = "5"
eframe = { version = "0.29" }
egui = "0.29"
csv = "1.3.0"
memmap2 = "0.9"
quick-xml = { version = "0.37.5", features = ["serialize"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
toml = "0.8"
tiny_http = "0.12.0"
