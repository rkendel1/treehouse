[workspace]
members = [
  "crates/treehouse-app",
  "crates/treehouse-core",
  "crates/treehouse-parser",
  "crates/treehouse-query",
  "crates/treehouse-search",
  "crates/treehouse-stats",
  "crates/treehouse-tree",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Treehouse Contributors"]

[workspace.dependencies]
anyhow = "1"
dirs = "5"
eframe = { version = "0.29" }
egui = "0.29"
memmap2 = "0.9"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
toml = "0.8"
